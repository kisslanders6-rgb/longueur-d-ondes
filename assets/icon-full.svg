  <g transform="translate(32 32) scale(.75) translate(-32 -32)">
    <path d="M8 30 Q 16 14 24 30 T 40 30 T 56 30" fill="none" stroke="#fbfaff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <rect x="30" y="10" width="4" height="44" rx="2" fill="#fbfaff"/>
    <rect x="26" y="8" width="12" height="7" rx="3.5" fill="#fbfaff"/>
    <circle cx="32" cy="38" r="5" fill="#fbfaff"/>
  </g>
</svg>
